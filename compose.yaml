# Local development database. Start with `pnpm db:up`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: paths
      POSTGRES_PASSWORD: paths
      POSTGRES_DB: paths
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paths -d paths"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
